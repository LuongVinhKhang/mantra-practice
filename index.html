<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantra Practice</title>
<meta name="description" content="A quiet, guided way to practise reading, chanting and writing mantras.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="app">

  <!-- ───────────────────────── HOME ───────────────────────── -->
  <section id="screen-home" class="screen is-active">
    <header class="home-head">
      <div class="head-row">
        <h1 data-i18n="app.title">Mantra Practice</h1>
        <select id="lang-select" data-i18n-label="lang.label"
                aria-label="Language" class="lang-select"></select>
      </div>
      <p class="sub" data-i18n="app.sub">One character, or one phrase, at a time.</p>
    </header>

    <div id="resume-box" class="resume" hidden>
      <p id="resume-text" class="resume-text"></p>
      <div class="resume-actions">
        <button id="resume-go" class="primary" type="button" data-i18n="resume.go">Resume</button>
        <button id="resume-clear" type="button" data-i18n="resume.clear">Start over</button>
      </div>
    </div>

    <label class="field">
      <span class="label" data-i18n="text.choose">Choose a text</span>
      <select id="text-select"></select>
    </label>

    <label class="field">
      <span class="label" data-i18n="text.label">Text</span>
      <textarea id="text-input" rows="4" spellcheck="false"
                data-i18n-ph="text.placeholder"
                placeholder="Paste your text here…"></textarea>
    </label>

    <div id="preview" class="preview" hidden>
      <p id="preview-meta" class="meta"></p>
      <div id="preview-items" class="preview-items"></div>
      <p id="preview-hint" class="preview-hint"></p>
    </div>

    <fieldset class="field">
      <legend class="label" data-i18n="mode.legend">Practice mode</legend>
      <label class="radio">
        <input type="radio" name="mode" value="writing" checked>
        <span><b data-i18n="mode.writing">Writing</b>
              <small data-i18n="mode.writing.hint">one character at a time</small></span>
      </label>
      <label class="radio">
        <input type="radio" name="mode" value="chanting">
        <span><b data-i18n="mode.chanting">Speaking / Chanting</b>
              <small data-i18n="mode.chanting.hint">one phrase at a time</small></span>
      </label>
    </fieldset>

    <fieldset class="field">
      <legend class="label" data-i18n="prog.legend">Progression</legend>
      <label class="radio">
        <input type="radio" name="prog" value="auto" checked>
        <span><b data-i18n="prog.auto">Automatic</b>
              <small data-i18n="prog.auto.hint">advances on a timer</small></span>
      </label>
      <label class="radio">
        <input type="radio" name="prog" value="manual">
        <span><b data-i18n="prog.manual">Manual</b>
              <small data-i18n="prog.manual.hint">you press Next</small></span>
      </label>
    </fieldset>

    <fieldset class="field">
      <legend class="label" data-i18n="read.legend">Pronunciation</legend>
      <label class="radio">
        <input type="checkbox" id="opt-hv">
        <span><b data-i18n="read.hv">Hán-Việt</b>
              <small>nam mô quan thế âm bồ tát</small></span>
      </label>
      <label class="radio">
        <input type="checkbox" id="opt-py">
        <span><b data-i18n="read.py">Pinyin</b>
              <small>nán wú guān shì yīn pú sà</small></span>
      </label>
      <label class="radio">
        <input type="checkbox" id="opt-yue">
        <span><b data-i18n="read.yue">Cantonese</b>
              <small>naam4 mou4 gun1 sai3 jam1 pou4 saat3</small></span>
      </label>
    </fieldset>

    <div class="field" id="speak-field" hidden>
      <span class="label" data-i18n="speak.legend">Read aloud</span>
      <select id="speak-select"></select>
      <p class="hint" id="speak-note" data-i18n="speak.note">Uses your device voice.</p>
    </div>

    <fieldset class="field" id="rec-field" hidden>
      <legend class="label" data-i18n="rec.legend">Recording</legend>
      <label class="radio">
        <input type="checkbox" id="opt-rec">
        <span><b data-i18n="rec.use">Practise with the recording</b>
              <small id="rec-note"></small></span>
      </label>
      <p class="hint" id="rec-credit"></p>
    </fieldset>

    <div class="row">
      <label class="field" id="speed-field">
        <span class="label" data-i18n="speed.label">Speed</span>
        <select id="speed-select">
          <option value="slow"   data-i18n="speed.slow">Slow</option>
          <option value="normal" data-i18n="speed.normal" selected>Normal</option>
          <option value="fast"   data-i18n="speed.fast">Fast</option>
        </select>
      </label>
      <label class="field">
        <span class="label" data-i18n="repeat.label">Repeat</span>
        <input id="repeat-input" type="number" min="1" max="1080" step="1"
               value="1" inputmode="numeric">
      </label>
    </div>

    <div class="field">
      <span class="label" data-i18n="size.label">Text size</span>
      <div class="sizer">
        <button id="size-down" type="button" aria-label="Smaller">A−</button>
        <span id="size-val">100%</span>
        <button id="size-up" type="button" aria-label="Larger">A+</button>
      </div>
    </div>

    <button id="start-btn" class="primary" type="button" data-i18n="start">Start Practice</button>
    <p id="home-error" class="error" role="alert" hidden></p>
    <button id="share-btn" class="link-btn" type="button" hidden data-i18n="share">Copy a link to these settings</button>
    <p id="share-note" class="meta center" hidden></p>
  </section>

  <!-- ─────────────────────── PRACTICE ─────────────────────── -->
  <section id="screen-practice" class="screen">
    <div id="stage" class="stage">
      <div class="item-wrap">
        <div id="item" class="item"></div>
        <div id="reading-hv" class="reading" hidden></div>
        <div id="reading-py" class="reading reading-py" hidden></div>
        <div id="reading-yue" class="reading reading-py" hidden></div>
      </div>
      <div class="zones" aria-hidden="true">
        <button class="zone" data-act="prev"  type="button" tabindex="-1"></button>
        <button class="zone" data-act="toggle" type="button" tabindex="-1"></button>
        <button class="zone" data-act="next"  type="button" tabindex="-1"></button>
      </div>
    </div>

    <div class="foot">
      <div id="rec-wrap" class="rec-wrap" hidden>
        <div id="rec-slot"></div>
        <p class="hint" id="rec-error" hidden></p>
      </div>
      <div class="bar"><span id="bar-fill"></span></div>
      <button id="counter" class="counter" type="button"
              data-i18n-title="counter.title"
              title="Show the whole text (O)"><span id="counter-text"></span></button>
      <div class="controls">
        <button id="btn-prev"    type="button" title="Previous (←)">←</button>
        <button id="btn-toggle"  type="button" class="wide" title="Pause / Resume (Space)">Pause</button>
        <button id="btn-next"    type="button" title="Next (→)">→</button>
        <button id="btn-speak"   type="button" hidden aria-label="Speak">🔊</button>
      </div>
      <div class="controls minor">
        <button id="btn-restart" type="button" data-i18n="btn.restart">Restart</button>
        <button id="btn-exit"    type="button" data-i18n="btn.exit">Exit</button>
      </div>
    </div>
  </section>

  <!-- ───────────────────────── DONE ───────────────────────── -->
  <section id="screen-done" class="screen">
    <div class="done-box">
      <h2 data-i18n="done.title">Practice complete</h2>
      <p class="sub" data-i18n="done.sub">Great job.</p>
      <button id="btn-again" class="primary" type="button" data-i18n="done.again">Practice Again</button>
      <button id="btn-home"  type="button" data-i18n="done.home">Back to Home</button>
    </div>
  </section>

</main>

<!-- ──────────────────── REPLACE-TEXT MODAL ──────────────────── -->
<div id="confirm" class="modal" hidden>
  <div class="modal-box" role="alertdialog" aria-labelledby="confirm-msg">
    <p id="confirm-msg" data-i18n="confirm.msg">Selecting this text will replace your current text.</p>
    <div class="modal-actions">
      <button id="confirm-cancel"  type="button" data-i18n="confirm.cancel">Cancel</button>
      <button id="confirm-replace" type="button" class="primary" data-i18n="confirm.replace">Replace text</button>
    </div>
  </div>
</div>

<!-- ─────────────────────── OVERVIEW MAP ─────────────────────── -->
<div id="overview" class="modal" hidden>
  <div class="ov-box">
    <div class="ov-head">
      <span id="ov-title"></span>
      <button id="ov-close" type="button" data-i18n="ov.close">Close</button>
    </div>
    <div id="ov-grid" class="ov-grid"></div>
    <p class="ov-hint" data-i18n="ov.hint">Tap any item to jump to it.</p>
  </div>
</div>

<!-- Classic scripts on purpose: <script type="module"> and fetch() are both
     blocked on file://, and this app must open by double-clicking index.html. -->
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/speech.js"></script>
<script src="js/media.js"></script>
<script src="js/segment.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/readings.js" defer></script>
<script src="js/reading.js"></script>
<script src="js/ui.js" defer></script>
</body>
</html>
